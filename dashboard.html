<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini cPanel — SAKIB HOST</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/main.css"></head><body><div class="shell"><aside><a class="brand" href="/"><span>SH</span> SAKIB HOST</a><div class="side-title">Mini cPanel</div><button data-tab="overview" class="side active">Overview</button><button data-tab="websites" class="side">Websites</button><button data-tab="activity" class="side">Activity</button><button data-tab="settings" class="side">Settings</button><button id="logout" class="side dangerText">Logout</button></aside><section class="content"><header class="bar"><div><small>Welcome back</small><h1 id="hello">Dashboard</h1></div><div class="user-dot" id="avatar">S</div></header><div class="ad ad-top"><a href="https://www.profitableratecpmnetwork.com/jfiimcmr?key=1d339b484b28a9790d6b0ac2ab9a5d6c" target="_blank" rel="noopener">ADVERTISEMENT</a></div>
<section id="overview" class="tab"><div class="stats"><div class="stat"><span>Websites</span><b id="webCount">0</b></div><div class="stat"><span>Storage Used</span><b id="storage">0 MB</b></div><div class="stat"><span>Versions</span><b id="versions">0</b></div></div><div class="panel"><div class="panelHead"><div><h2>Quick Deploy</h2><p>Upload one HTML file to create or update a website.</p></div></div><form id="uploadForm" class="deploy"><input id="siteName" placeholder="Website name e.g. portfolio" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,50}" required><input id="siteFile" type="file" accept=".html,.htm" required><button class="btn">Deploy</button></form><div id="msg" class="msg"></div></div></section>
<section id="websites" class="tab hidden"><div class="panel"><div class="panelHead"><div><h2>My Websites</h2><p>Manage your deployed sites.</p></div><button id="refresh" class="btn ghost small">Refresh</button></div><div id="projects" class="projects"></div></div></section>
<section id="activity" class="tab hidden"><div class="panel"><h2>Recent Activity</h2><div id="activityList" class="activity"></div></div></section>
<section id="settings" class="tab hidden"><div class="panel"><h2>Account Settings</h2><p>Change your password securely.</p><form id="passwordForm" class="formGrid"><input id="currentPassword" type="password" placeholder="Current password" required><input id="newPassword" type="password" placeholder="New password (8+)" required><input id="confirmPassword" type="password" placeholder="Confirm new password" required><button class="btn">Change Password</button></form><div id="setMsg" class="msg"></div></div></section>
</section></div><script src="/js/cpanel.js"></script></body></html>
